name: Bloodfang quality and website checks

on:
  push:
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/test-python.yml"
      - "Procfile"
  pull_request:
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/test-python.yml"
      - "Procfile"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Syntax, imports and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile every Python file
        run: python -m compileall -q .
      - name: Run all unit and dashboard smoke tests
        env:
          DATA_DIR: ${{ runner.temp }}/bloodfang-test-data
        run: python -m unittest discover -v

  website:
    name: Check live dashboard after deploy and periodically
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name != 'pull_request'
    steps:
      - name: Wait for dashboard health endpoint
        shell: bash
        run: |
          URL="https://ironwolf-bot.up.railway.app/healthz"
          for attempt in $(seq 1 30); do
            CODE=$(curl --silent --show-error --max-time 15 --output /tmp/health.json --write-out "%{http_code}" "$URL" || true)
            if [ "$CODE" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              echo "Dashboard is healthy: $(cat /tmp/health.json)"
              exit 0
            fi
            echo "Health check attempt $attempt/30 returned HTTP ${CODE:-no response}"
            sleep 15
          done
          echo "::error::Dashboard health check failed after 7.5 minutes."
          cat /tmp/health.json || true
          exit 1